# BBW2 (AM6254) JTAG 配置
# 改自 OpenOCD board/ti_am625evm.cfg：探针换 J-Link，复位方式按本板实际。
#
# 接口：J19 = Tag-Connect TC2050-IDC 裸焊盘（ARM 10-pin，1.27mm，按住才接触）
#   1 VTREF(=VSYS_3V3)  2 TMS→R287  3 GND  4 TCK→R288  5 GND
#   6 TDO→R293  7 EMU0→R292  8 TDI→R291  9 nTRST→R290  10 EMU1→R289
#   EMU0/1 板载 10K 上拉，可不接；nTRST【必接】：R157 4.7K 下拉常把 TAP
#   按在复位里，不接 nTRST = 扫链恒全 1。
#
# 仿真器：SEGGER J-Link V9.3 Plus
#
# 用法：
#   openocd -f configs/bbw2_jtag.cfg
#   telnet localhost 4444          # gdb 各核 3333~3339（sysctrl=3333, a53.0=3334…）
# 板无 SRST 引出：reset init 不可用，attach-only（halt/resume/断点不受影响）

source [find interface/jlink.cfg]

transport select jtag

# BBW2 有 nTRST、无 SRST（与 EVM 的 srst_only 不同）
reset_config trst_only

if { ![info exists SOC] } {
	set SOC am625
}

source [find target/ti_k3.cfg]

# 2500kHz 实测可通；接触不稳（按压状态变化）时降 1000/500
adapter speed 2500
