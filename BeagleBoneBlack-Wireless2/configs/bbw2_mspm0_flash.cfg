# BBW2 U11 (MSPM0L1105) SWD 烧录配置 — 自包含版（内联 master tcl/target/ti/mspm0.cfg，
# 无需 -s 脚本库搜索路径，openocd-scripts/ 目录可删除）
#
# 用法（仓库根目录）：
#   export SSHPASS=<板密码>                       # NRST 脉冲走 SSH 需要；BBW2_HOST 默认 root@10.0.0.240
#   ./openocd -f configs/bbw2_mspm0_flash.cfg \
#     -c "init" -c "targets" \
#     -c "program firmwares/pcu_bbw2.bin 0 verify" \
#     -c "reset run" -c "shutdown"
#
# 前提：① invoke 上拉（J28.32→3V3）+ 整板断电上电（PCU 态 SWD 是锁的，复位/reboot 无效）
#       ② CMSIS-DAP 探针接 TP8(SWDIO)/TP9(SWCLK)/TP1(VTref)/GND
# 探针 nRESET 禁止接 MCU_NRSTN（U43 与门推挽输出，对顶短路）。

adapter driver cmsis-dap
# 300kHz：1000kHz 在杜邦线接线下降临界（2026-11-13 实测连不上），降速稳定
adapter speed 300

# ===================== 目标定义（自 master ti/mspm0.cfg）=====================
transport select swd

set _CHIPNAME mspm0
set _DAP_SWD_ID 0x6ba02477

swd newdap $_CHIPNAME cpu -expected-id $_DAP_SWD_ID
dap create $_CHIPNAME.dap -tap $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x400 -work-area-backup 0

# 空片/低功耗态唯一解法：examine 前写 PWR AP（AP#4）禁睡眠（IHIB_SLP）
proc _mspm0_enable_low_power_mode { } {
	$::_CHIPNAME.dap apreg 4 0x00 0x104008
	$::_CHIPNAME.dap apreg 4 0xF0 0x01
	$::_CHIPNAME.dap apreg 4 0x00 0x100008
}
$_TARGETNAME configure -event examine-start { _mspm0_enable_low_power_mode }

# flash banks（program 命令依赖；size 0 = 驱动自动探测）
flash bank $_CHIPNAME.flash.main mspm0 0 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash.nonmain mspm0 0x41c00000 0 0 0 $_TARGETNAME
flash bank $_CHIPNAME.flash.data mspm0 0x41d00000 0 0 0 $_TARGETNAME

cortex_m reset_config sysresetreq

# ============ NRST：SSH→AM62 GPIO0_0 脉冲（板上无 MSPM0 实体复位键）============
# gpioset v2 默认 wait 模式挂住 → 后台+kill 写法（Debian 13 实测坑）
proc mspm0_board_reset {} {
	if {[catch {set host $::env(BBW2_HOST)}]} { set host root@10.0.0.240 }
	exec sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
		-o ControlMaster=auto -o ControlPath=/tmp/ssh-bbw2-mspm0 -o ControlPersist=120 \
		$host {gpioset -c gpiochip3 0=0 >/dev/null 2>&1 & P=$!; sleep 0.25; kill -9 $P 2>/dev/null; gpioset -c gpiochip3 0=1 >/dev/null 2>&1 & P=$!; sleep 0.25; kill -9 $P 2>/dev/null}
	set timeout 2000
	while {$timeout > 0} {
		if {![catch {$::_TARGETNAME arp_examine}]} { return }
		sleep 100
		set timeout [expr {$timeout - 100}]
	}
	error "board reset: DebugSS failed to come up within timeout"
}

# ======== DSSM 救援命令（自 master；⚠️ 未充分验证：factory_reset 实测报成功实际无效）========
proc _mspm0_wait_for_dssm_response {command} {
	set timeout 1000
	while { [expr { [$::_CHIPNAME.dap apreg 2 0xc] & 0x1}] != 0x1 } {
		sleep 1
		set timeout [expr {$timeout - 1}]
		if { $timeout == 0 } {
			set rcr [$::_CHIPNAME.dap apreg 2 0xc]
			return -code error [format "MSPM0 SECAP RCR=0x%08x timeout rx_valid" $rcr]
		}
	}
	set rxd [$::_CHIPNAME.dap apreg 2 0x8]
	set rcr [$::_CHIPNAME.dap apreg 2 0xc]
	if { ([expr { $command & 0xff}] == $rcr) && ($rxd == 0x10003) } {
		return 0
	}
	return -code error [format "MSPM0 SECAP CMD FAIL! RXD: 0x%08X RCR: 0x%08X" $rxd $rcr]
}

proc _mspm0_dssm_command {command} {
	$::_CHIPNAME.dap apreg 2 0x4 $command
	$::_CHIPNAME.dap apreg 2 0x0 0x0
	set rxd [$::_CHIPNAME.dap apreg 2 0x8]
	set rcr [$::_CHIPNAME.dap apreg 2 0xc]
	sleep 1000
	mspm0_board_reset
	set res [_mspm0_wait_for_dssm_response $command]
	if { $res } {
		return $res
	}
	sleep 1000
	mspm0_board_reset
	sleep 1000
	return 0
}

proc mspm0_mass_erase {} {
	set res [_mspm0_dssm_command 0x020c]
	if { $res } {
		echo "Mass Erase failed!"
	} else {
		echo "Mass Erase success! Halting Processor"
		halt
	}
	return $res
}

proc mspm0_factory_reset {} {
	set res [_mspm0_dssm_command 0x020a]
	if { $res } {
		echo "Factory Reset failed!"
	} else {
		echo "Factory reset success! Halting processor"
		halt
	}
	return $res
}

proc mspm0_start_bootloader {} {
	set res [_mspm0_dssm_command 0x0108]
	if { $res } {
		echo "Start BL failed!"
	}
	return $res
}
