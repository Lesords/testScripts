# BBW2 U11 (MSPM0L1105) SWD 探测配置
# 用法: openocd -f mspm0_probe.cfg [-c "interface xxx"]
# 探针默认按 CMSIS-DAP；若是其他探针，改第一行 adapter driver

adapter driver cmsis-dap
adapter speed 300

transport select swd

# Cortex-M0+ SW-DP；故意不写 -expected-id，
# 让 OpenOCD 打印实测 IDCODE（探测目的）
set _CHIPNAME mspm0
swd newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 0
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

# MSPM0L1105: 32KB FLASH @0x00000000, 4KB SRAM @0x20000000
# （仅探测用，不配 flash 驱动；烧录走 mass erase + BSL）
